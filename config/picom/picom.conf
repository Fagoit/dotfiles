# picom config for the WindowMaker (dotfiles) session.
# Glossy rounded windows, fading, and a soft purple glow.
# Animations are ported from Roel-6/wmaker-dotfiles (see animations.conf).

#################################
#          Backend              #
#################################
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
# Let fullscreen windows (games, video) bypass the compositor entirely. Without
# this, picom composites every game -> input lag, vsync capping and stutter.
# This is the single biggest X11 gaming fix and removes the need for Wayland.
unredir-if-possible = true;

#################################
#           Corners             #
#################################
# Square corners (no rounding).
corner-radius = 0;

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.55;
shadow-offset-x = -20;
shadow-offset-y = -20;
# Soft glow instead of a plain black drop shadow. Color lives in shadow.conf so
# pywal can recolor it to match the wallpaper (default: purple).
@include "shadow.conf"

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

frame-opacity = 1.0;

#################################
#         Window rules          #
# Per-window overrides live here (v13 prefers `rules` over old-style
# *-exclude lists). Globals above are the defaults.
#################################
rules: (
  { match = "window_type = 'dock'";    shadow = false; },
  { match = "window_type = 'desktop'"; shadow = false; },
  { match = "_GTK_FRAME_EXTENTS@";     shadow = false; },
  @include "animations.conf"
)
