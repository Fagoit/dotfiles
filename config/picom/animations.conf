# Window animations (ported from Roel-6/wmaker-dotfiles).
# Included by picom.conf inside the `rules` block.

#  ___________________ Normal windows ___________________
{
  match = "window_type = 'normal'";
  animations = (
    {
      triggers = ["geometry"];
      scale-x = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.2;
        start = "window-width-before / window-width";
        end = 1;
      }
      scale-y = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.2;
        start = "window-height-before / window-height";
        end = 1;
      }
      offset-x = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.2;
        start = "window-x-before - window-x";
        end = 0;
      }
      offset-y = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.2;
        start = "window-y-before - window-y";
        end = 0;
      }
      shadow-scale-x = "scale-x";
      shadow-scale-y = "scale-y";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
    }
  )
},

#  ___________________ Rofi launchers ___________________
{
  match = "class_g = 'Rofi'";
  animations = (
    {
      triggers = ["close"];
      opacity = {
        curve = "cubic-bezier(0,1,1,1)";
        duration = 0.3;
        start = "window-raw-opacity-before";
        end = 0;
      };
      blur-opacity = "opacity";
      shadow-opacity = "opacity";
      offset-x = "(1 - scale-x) / 2 * window-width";
      offset-y = "(1 - scale-y)";
      scale-x = {
        curve = "cubic-bezier(0,0,0,1)";
        duration = 0.3;
        start = 1;
        end = 0.0;
      };
      scale-y = {
        curve = "cubic-bezier(0,0,0,1)";
        duration = 0.3;
        start = 1;
        end = 0.0;
      };
      shadow-scale-x = "scale-x";
      shadow-scale-y = "scale-y";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
    },
    {
      triggers = ["open", "show"];
      opacity = {
        curve = "cubic-bezier(0,1,1,1)";
        duration = 0.5;
        start = 0;
        end = "window-raw-opacity";
      };
      blur-opacity = "opacity";
      shadow-opacity = "opacity";
      offset-x = "(1 - scale-x) / 2 * window-width";
      offset-y = {
        curve = "cubic-bezier(0.42,0,0,1)";
        duration = 0.2;
        start = 1;
        end = 1;
      };
      scale-x = {
        curve = "cubic-bezier(0.42,0,0,1)";
        duration = 0.5;
        start = 0.0;
        end = 1;
      };
      scale-y = {
        curve = "cubic-bezier(0.42,0,0,1)";
        duration = 0.5;
        start = 0.0;
        end = 1;
      };
      shadow-scale-x = "scale-x";
      shadow-scale-y = "scale-y";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
    }
  )
},

#  ___________________ i3lock ___________________
{
  match = "class_g = 'i3lock'";
  animations = (
    {
      triggers = ["close", "hide"];
      preset = "disappear";
      scale = 1;
      duration = 0.3;
    },
    {
      triggers = ["open", "show"];
      preset = "appear";
      scale = 1;
      duration = 0.3;
    }
  )
},

#  ___________________ Dunst notifications ___________________
{
  match = "class_g = 'Dunst'";
  animations = (
    {
      triggers = ["close", "hide"];
      preset = "fly-out";
      direction = "right";
    },
    {
      triggers = ["open", "show"];
      preset = "fly-in";
      direction = "right";
    },
    {
      triggers = ["geometry"]
      scale-x = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.5;
        start = "window-width-before / window-width";
        end = 1;
      }
      scale-y = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.5;
        start = "window-height-before / window-height";
        end = 1;
      }
      offset-x = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.5;
        start = "window-x-before - window-x";
        end = 0;
      }
      offset-y = {
        curve = "cubic-bezier(0,0,0.22,1)";
        duration = 0.5;
        start = "window-y-before - window-y";
        end = 0;
      }
      shadow-scale-x = "scale-x";
      shadow-scale-y = "scale-y";
      shadow-offset-x = "offset-x";
      shadow-offset-y = "offset-y";
    }
  )
},
